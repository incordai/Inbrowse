<!doctype html>
<html lang="en" style="margin:0">
<head>
  <meta charset="utf-8">
  <title>Background image tiling</title>
  <style>
    body { margin: 0; background: #ffffff; }
    .box { position: absolute; width: 100px; height: 40px; background-color: #ffffff;
      background-image: url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABQAAAAUCAYAAACNiR0NAAAAI0lEQVR4nGN4YGj4nxgsWXiIKMwwauCogaMGjho4auBINRAAEtiNjim6bskAAAAASUVORK5CYII=); }
    .a { left: 20px; top: 20px; }
    .b { left: 140px; top: 20px; background-repeat: repeat-x; }
    .c { left: 260px; top: 20px; background-repeat: no-repeat; }
    .d { left: 20px; top: 100px; background-size: 10px 10px; }
    .e { left: 140px; top: 100px; width: 110px; background-position: center; }
    .f { left: 20px; top: 180px; width: 108px; background-repeat: space; }
    .g { left: 160px; top: 180px; width: 88px; background-repeat: round; }
    .h { left: 280px; top: 180px; background-repeat: no-repeat;
      background-image: url(data:image/svg+xml;base64,PHN2ZyB4bWxucz0naHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmcnIHZpZXdCb3g9JzAgMCAxMCAxMCc+PHJlY3Qgd2lkdGg9JzEwJyBoZWlnaHQ9JzEwJyBmaWxsPScjMmY5ZTQ0Jy8+PC9zdmc+); }
    .i { left: 20px; top: 260px; box-sizing: content-box; width: 80px; height: 20px; padding: 10px;
      background-repeat: no-repeat; background-origin: content-box; }
    .j { left: 160px; top: 260px; box-sizing: content-box; width: 80px; height: 20px; padding: 10px;
      background-origin: content-box; background-clip: content-box; }
  </style>
</head>
<body>
  <div class="box a"></div>
  <div class="box b"></div>
  <div class="box c"></div>
  <div class="box d"></div>
  <div class="box e"></div>
  <div class="box f"></div>
  <div class="box g"></div>
  <div class="box h"></div>
  <div class="box i"></div>
  <div class="box j"></div>
</body>
</html>
