[package]
name = "inbrowse-ocr"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Text from images through the Incord memory engine's OCR endpoint, for Inbrowse"

[dependencies]
# All already in the workspace lockfile (reqwest via inbrowse-net, the image
# codecs via inbrowse-render). No OCR model ships with Inbrowse.
reqwest = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
base64 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
